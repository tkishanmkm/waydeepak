      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

      return m.symbol + n.toLocaleString(m.locale, {
        minimumFractionDigits: n >= 10000 ? 0 : 2,
        maximumFractionDigits: 2
      });
    }

    function formatCrypto(amount, crypto = 'USDT') {
      const m = COINS[crypto] || COINS.USDT;
      const n = Number.isFinite(Number(amount)) ? Number(amount) : 0;
      return n.toFixed(m.decimals);
    }

    function shortAddr(addr) {
      if (!addr || addr.length < 12) return addr || 'Not Initialized';
      return `${addr.slice(0, 6)}...${addr.slice(-4)}`;
    }

    function timeAgo(ts) {
      if (!ts) return 'Just now';
      const diff = Math.max(0, Math.floor((Date.now() - Number(ts)) / 1000));
      if (diff < 60) return `${diff}s ago`;
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;
    }

    function copyText(text, successMsg = 'Copied to clipboard!') {
      try {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        ta.setSelectionRange(0, 99999);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) {
          showToast(successMsg, 'success');
          return;
        }
      } catch (err) {
        console.error('Copy error:', err);
      }
      showToast('Unable to copy automatically — please select and copy manually.', 'warning');
    }

    async function sha256Hex(str) {
      const data = new TextEncoder().encode(str);
      if (window.crypto && window.crypto.subtle) {
        const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      // Deterministic fallback hash only if subtle crypto is unavailable in insecure HTTP preview
      let h = 2166136261;
      for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
      return 'fb_' + (h >>> 0).toString(16).padStart(8, '0');
    }

    function generateQRSVG(seedStr) {
      let h = 2166136261;
      for (let i = 0; i < seedStr.length; i++) { h ^= seedStr.charCodeAt(i); h = Math.imul(h, 16777619); }
      const cells = 21, size = 168, cell = size / cells;
      let rects = '';
      const isFinder = (r, c) => (r < 7 && c < 7) || (r < 7 && c >= cells - 7) || (r >= cells - 7 && c < 7);
      const finder = (ox, oy) => `
        <rect x="${ox}" y="${oy}" width="${cell * 7}" height="${cell * 7}" rx="3" fill="#0B0B11"/>
        <rect x="${ox + cell}" y="${oy + cell}" width="${cell * 5}" height="${cell * 5}" rx="2" fill="#FFF"/>
        <rect x="${ox + cell * 2}" y="${oy + cell * 2}" width="${cell * 3}" height="${cell * 3}" rx="1.5" fill="#0B0B11"/>
      `;
      for (let r = 0; r < cells; r++) {
        for (let c = 0; c < cells; c++) {
          if (isFinder(r, c) || (r >= 8 && r <= 12 && c >= 8 && c <= 12)) continue;
          h = (Math.imul(h, 1664525) + 1013904223) >>> 0;
          if ((h & 3) !== 0 && ((r + c + (h & 1)) % 2 === 0 || (h & 7) > 3)) {
            rects += `<rect x="${(c * cell).toFixed(1)}" y="${(r * cell).toFixed(1)}" width="${(cell + 0.3).toFixed(1)}" height="${(cell + 0.3).toFixed(1)}" rx="1" fill="#0B0B11"/>`;
          }
        }
      }
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="rounded-2xl bg-white p-2.5 shadow-xl">
        <rect width="${size}" height="${size}" fill="#FFF"/>
        ${finder(0, 0)}${finder((cells - 7) * cell, 0)}${finder(0, (cells - 7) * cell)}
        ${rects}
        <rect x="${8 * cell}" y="${8 * cell}" width="${5 * cell}" height="${5 * cell}" rx="8" fill="#8D68F6"/>
        <path d="M68 74L72 85L76.5 77L81 85L85 74" stroke="#FFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none" transform="translate(7.5, 4.5)"/>
      </svg>`;
    }

    /* =========================================================================
       5. FIREBASE BOOTSTRAP, AUTH & REAL-TIME SNAPSHOT LISTENERS

    function getCurrentProfile() {
      if (!state.authUser) return null;
      return state.usersMap[state.authUser.uid] || null;
    }

    function getUserBalances(profile = getCurrentProfile()) {
      const defAvail = { USDT: 0, USDC: 0, BTC: 0, ETH: 0, SOL: 0 };
      const defLocked = { USDT: 0, USDC: 0, BTC: 0, ETH: 0, SOL: 0 };
      if (!profile) return { available: defAvail, locked: defLocked };
      return {
        available: { ...defAvail, ...(profile.balances || {}) },
        locked: { ...defLocked, ...(profile.lockedBalances || {}) }
      };
    }

    async function ensureUserProfileDoc(fbUser, customName = '') {
      if (!fbUser || fbUser.isAnonymous || !db) return;
      try {
        const ref = pubDoc('users', fbUser.uid);
        const snap = await getDoc(ref);
        if (!snap.exists()) {
          const displayName = customName || fbUser.displayName || (fbUser.email ? fbUser.email.split('@')[0] : 'Trader_' + fbUser.uid.slice(0, 5));
          await setDoc(ref, {
            uid: fbUser.uid,
            displayName,
            email: fbUser.email || '',
            publicWalletAddress: state.deviceWallet.address || '',
            balances: { USDT: 250, USDC: 100, BTC: 0.0025, ETH: 0.05, SOL: 1.0 },
            lockedBalances: { USDT: 0, USDC: 0, BTC: 0, ETH: 0, SOL: 0 },
            completedTrades: 0,
            totalTrades: 0,
            banned: false,
            createdAt: Date.now()
          });
        } else if (state.deviceWallet.address && !snap.data().publicWalletAddress) {
          await updateDoc(ref, { publicWalletAddress: state.deviceWallet.address });
        }
      } catch (err) {
        console.error('ensureUserProfileDoc failed:', err);
      }
    }

    function attachFirestoreListeners() {
      detachFirestoreListeners();
      if (!db || !state.authUser) return;

      // 1. Users Collection
      unsubscribers.push(
        onSnapshot(pubCol('users'), (snap) => {
          const map = {};
          snap.forEach(d => { map[d.id] = { id: d.id, ...d.data() }; });
          state.usersMap = map;
          renderAll();
        }, (err) => console.error('Users listener error:', err))
      );

      // 2. Offers Collection (sorted in JS memory per Rule 2)
      unsubscribers.push(
        onSnapshot(pubCol('offers'), (snap) => {
          const list = [];
          snap.forEach(d => { list.push({ id: d.id, ...d.data() }); });
          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          state.offers = list;
          renderAll();
        }, (err) => console.error('Offers listener error:', err))
      );

      // 3. Trades Collection
      unsubscribers.push(
        onSnapshot(pubCol('trades'), (snap) => {
          const list = [];
          snap.forEach(d => { list.push({ id: d.id, ...d.data() }); });
          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          state.trades = list;
          renderAll();
          if (state.activeTradeRoomId) refreshTradeRoomModal();
          if (state.ownerPanelOpen) renderOwnerOverlay();
        }, (err) => console.error('Trades listener error:', err))
      );

      // 4. Trade Messages Collection (filtered per tradeId in JS memory)
      unsubscribers.push(
        onSnapshot(pubCol('trade_messages'), (snap) => {
          const list = [];
          snap.forEach(d => { list.push({ id: d.id, ...d.data() }); });
          list.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
          state.messages = list;
          if (state.activeTradeRoomId) refreshTradeRoomModal();
          if (state.ownerPanelOpen && state.selectedAdminDisputeId) renderOwnerOverlay();
        }, (err) => console.error('Messages listener error:', err))
      );

      // 5. System Owner Config Document
      unsubscribers.push(
        onSnapshot(pubDoc('system', 'adminConfig'), (snap) => {
          state.adminConfig = snap.exists() ? snap.data() : null;
          if (state.ownerPanelOpen) {
            // Immediately revoke overlay if auth user no longer matches ownerUid
            if (!state.authUser || !state.adminConfig || state.adminConfig.ownerUid !== state.authUser.uid) {
              closeOwnerOverlay();
            } else {
              renderOwnerOverlay();
            }
          }
        }, (err) => console.error('System config listener error:', err))
      );
    }

    function detachFirestoreListeners() {
      unsubscribers.forEach(fn => { try { fn(); } catch (e) {} });
      unsubscribers = [];
    }

    async function bootFirebase() {
      try {
        let fbConfig = null;
        if (typeof __firebase_config !== 'undefined' && __firebase_config) {
          fbConfig = typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config;
        }

        if (!fbConfig || !fbConfig.apiKey) {
          state.firebaseMode = 'offline_demo';
          state.firebaseReady = true;
          renderAll();
          showToast('Running in preview mode. Add your Firebase config to enable live cloud sync.', 'warning');
          return;
        }

        const fbApp = initializeApp(fbConfig);
        db = getFirestore(fbApp);
        auth = getAuth(fbApp);

        // RULE 3: Authenticate FIRST before attaching any Firestore listeners
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          try {
            await signInWithCustomToken(auth, __initial_auth_token);
          } catch (tokenErr) {
            console.warn('Custom token fallback to anonymous:', tokenErr);
            await signInAnonymously(auth);
          }
        } else if (!auth.currentUser) {
          await signInAnonymously(auth);
        }

        state.firebaseMode = 'live';
        state.firebaseReady = true;

        onAuthStateChanged(auth, async (user) => {
          if (!user) {
            // Keep anonymous read session active so live marketplace continues smoothly
            try {
              await signInAnonymously(auth);
              return;
            } catch (e) {
              console.error('Re-anon failed:', e);
            }
          }
          state.authUser = user;
          state.isMember = Boolean(user && !user.isAnonymous);
          if (state.isMember) {
            await ensureUserProfileDoc(user);
          } else {
            state.ownerSessionUnlocked = false;
            closeOwnerOverlay();
          }
          attachFirestoreListeners();
          renderAll();
        });
      } catch (err) {
        console.error('Firebase bootstrap error:', err);
        state.firebaseMode = 'offline_demo';
        state.firebaseReady = true;
        renderAll();
        showToast('Cloud connection issue — check console or Firebase config.', 'error');
      }
    }

    async function submitAuthForm(e, mode) {
      e.preventDefault();
      if (!auth) {
        showToast('Firebase Authentication is not configured yet.', 'error');
        return;
      }
      const email = (document.getElementById('auth-email-inp')?.value || '').trim();
      const pass = document.getElementById('auth-pass-inp')?.value || '';
      const name = (document.getElementById('auth-name-inp')?.value || '').trim();
      const errBox = document.getElementById('auth-err-box');
      const btn = document.getElementById('auth-submit-btn');

      if (errBox) errBox.classList.add('hidden');
      if (btn) { btn.disabled = true; btn.textContent = 'Please wait...'; }

      try {
        if (mode === 'signup') {
          const cred = await createUserWithEmailAndPassword(auth, email, pass);
          if (name) {
            await updateProfile(cred.user, { displayName: name });
          }
          await ensureUserProfileDoc(cred.user, name);
          closeModal();
          showToast(`Welcome to Wayones, ${name || email}!`, 'success');
        } else {
          const cred = await signInWithEmailAndPassword(auth, email, pass);
          await ensureUserProfileDoc(cred.user);
          closeModal();
          showToast('Signed in successfully!', 'success');
        }
      } catch (err) {
        console.error('Auth error:', err);
        let msg = 'Authentication failed. Please verify your details.';
        if (err.code === 'auth/email-already-in-use') msg = 'This email is already registered. Try signing in.';
        else if (err.code === 'auth/invalid-credential' || err.code === 'auth/wrong-password' || err.code === 'auth/user-not-found') msg = 'Invalid email or password.';
        else if (err.code === 'auth/weak-password') msg = 'Password must be at least 6 characters.';
        else if (err.code === 'auth/operation-not-allowed') msg = 'Email/Password sign-in is disabled in Firebase Console. Enable it under Authentication > Sign-in method.';
        if (errBox) { errBox.textContent = msg; errBox.classList.remove('hidden'); }
        if (btn) { btn.disabled = false; btn.textContent = mode === 'signup' ? 'Create Account & Start Trading' : 'Sign In'; }

    function getCombinedMarketOffers() {
      const liveActive = state.offers.filter(o => o.status === 'ACTIVE');
      // Always display Featured Liquidity when live offers are empty (or show alongside so all coins/fiats have depth)
      return liveActive.length > 0 ? [...liveActive, ...FEATURED_OFFERS] : [...FEATURED_OFFERS];
    }

    function getFilteredOffers() {
      const f = state.marketFilter;
      // If user wants to BUY crypto, match offers where creator type === 'SELL'
      // If user wants to SELL crypto, match offers where creator type === 'BUY'
      const targetOfferType = f.userAction === 'BUY' ? 'SELL' : 'BUY';
      const amtNum = parseFloat(f.amount);

      const list = getCombinedMarketOffers().filter(o => {
        if (o.type !== targetOfferType) return false;
        if (o.crypto !== f.crypto) return false;
        if (o.fiat !== state.fiat) return false;
        if (f.payment !== 'ALL' && !(o.paymentMethods || []).includes(f.payment)) return false;
        const tp = Boolean(o.termsFlags && o.termsFlags.thirdPartyAllowed);
        if (f.thirdParty === 'OWN_ONLY' && tp) return false;
        if (f.thirdParty === 'ALLOWED' && !tp) return false;
        if (!isNaN(amtNum) && amtNum > 0) {
          if (amtNum < Number(o.minLimit) || amtNum > Number(o.maxLimit)) return false;
        }
        return true;
      });

      list.sort((a, b) => {
        // Real live user offers appear first before featured samples when rates are close
        if (!a.isFeatured && b.isFeatured) return -1;
        if (a.isFeatured && !b.isFeatured) return 1;
        if (f.sort === 'newest') return (b.createdAt || 0) - (a.createdAt || 0);
        if (f.sort === 'completion') {
          const ca = a.isFeatured ? a.completionRate : computeUserCompletion(a.creatorUid);
          const cb = b.isFeatured ? b.completionRate : computeUserCompletion(b.creatorUid);
          return cb - ca;
        }
        return f.userAction === 'BUY' ? (Number(a.price) - Number(b.price)) : (Number(b.price) - Number(a.price));
      });

      return list;
    }

    function computeUserCompletion(uid) {
      const u = state.usersMap[uid];
      if (!u || !u.totalTrades) return 100.0;
      return Number(((u.completedTrades / u.totalTrades) * 100).toFixed(1));
    }

              <!-- Mandatory Terms Checkbox -->

                  I have read and agree to <strong>${esc(offer.creatorName)}</strong>'s terms and payment policy.
                </span>

      validateTradeDraft();

    function validateTradeDraft() {
      if (!tradeDraft) return false;
      const fiat = parseFloat(document.getElementById('td-fiat-inp')?.value);
      const crypto = parseFloat(document.getElementById('td-crypto-inp')?.value);
      const errBox = document.getElementById('td-err-box');
      const btn = document.getElementById('td-confirm-btn');
      const { offer, isUserBuying, agreed } = tradeDraft;

      let err = '';
      if (isNaN(fiat) || fiat <= 0 || isNaN(crypto) || crypto <= 0) {
        err = 'Enter a valid trade amount.';
      } else if (fiat < Number(offer.minLimit) - 0.01) {
        err = `Minimum limit is ${formatFiat(offer.minLimit, offer.fiat)}.`;
      } else if (fiat > Number(offer.maxLimit) + 0.01) {
        err = `Maximum limit is ${formatFiat(offer.maxLimit, offer.fiat)}.`;
      } else if (!isUserBuying) {
        const avail = Number(getUserBalances().available[offer.crypto] || 0);
        if (crypto > avail) {
          err = `Insufficient ${offer.crypto} Available Balance (${formatCrypto(avail, offer.crypto)} ${offer.crypto}). Claim Test USDT from Wallet Faucet first!`;
        }
      } else if (!agreed) {
        err = 'Please check the box confirming you agree to the trader\'s terms.';
      }

      if (errBox && btn) {
        if (err) {
          errBox.textContent = err;
          errBox.classList.remove('hidden');
          btn.disabled = true;
          btn.classList.add('opacity-50', 'cursor-not-allowed');
          return false;
        }
        errBox.classList.add('hidden');
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
      return true;
    }

    async function confirmOpenTrade() {
      if (!validateTradeDraft() || !tradeDraft || !db || !state.authUser) return;
      const btn = document.getElementById('td-confirm-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'Locking Escrow...'; }

      try {
        const fiatAmount = Number(parseFloat(document.getElementById('td-fiat-inp').value).toFixed(2));
        const cryptoAmount = Number(parseFloat(document.getElementById('td-crypto-inp').value).toFixed(COINS[tradeDraft.offer.crypto].decimals));
        const { offer, isUserBuying, selectedPayment } = tradeDraft;
        const meProf = getCurrentProfile();
        const myName = (meProf && meProf.displayName) || state.authUser.displayName || state.authUser.email.split('@')[0];

        const buyerUid = isUserBuying ? state.authUser.uid : offer.creatorUid;
        const buyerName = isUserBuying ? myName : offer.creatorName;
        const sellerUid = isUserBuying ? offer.creatorUid : state.authUser.uid;
        const sellerName = isUserBuying ? offer.creatorName : myName;

        // Deduct Seller's Testnet Available Balance and move to Locked Escrow if Seller is a real user doc
        if (!isUserBuying) {
          const bal = getUserBalances(meProf);
          const newAvail = Math.max(0, Number((bal.available[offer.crypto] - cryptoAmount).toFixed(8)));
          const newLocked = Number(((bal.locked[offer.crypto] || 0) + cryptoAmount).toFixed(8));
          await updateDoc(pubDoc('users', state.authUser.uid), {
            balances: { ...bal.available, [offer.crypto]: newAvail },
            lockedBalances: { ...bal.locked, [offer.crypto]: newLocked }
          });
        } else if (!offer.isFeatured && state.usersMap[sellerUid]) {
          const sBal = getUserBalances(state.usersMap[sellerUid]);
          if ((sBal.available[offer.crypto] || 0) >= cryptoAmount) {
            await updateDoc(pubDoc('users', sellerUid), {
              balances: { ...sBal.available, [offer.crypto]: Math.max(0, Number((sBal.available[offer.crypto] - cryptoAmount).toFixed(8))) },
              lockedBalances: { ...sBal.locked, [offer.crypto]: Number(((sBal.locked[offer.crypto] || 0) + cryptoAmount).toFixed(8)) }
            });
          }
        }

        const now = Date.now();
        const tradeDoc = {
          offerId: offer.id,
          isFeaturedCounterparty: Boolean(offer.isFeatured),
          buyerUid,
          buyerName,
          sellerUid,
          sellerName,
          crypto: offer.crypto,
          fiat: offer.fiat,
          fiatAmount,
          cryptoAmount,
          price: Number(offer.price),
          paymentMethod: selectedPayment,
          frozenTermsSnapshot: {
            thirdPartyAllowed: Boolean(offer.termsFlags && offer.termsFlags.thirdPartyAllowed),
            noCryptoRemarks: Boolean(offer.termsFlags && offer.termsFlags.noCryptoRemarks),
            videoProofRequired: Boolean(offer.termsFlags && offer.termsFlags.videoProofRequired),
            idRequired: Boolean(offer.termsFlags && offer.termsFlags.idRequired),
            publicTerms: offer.publicTerms || ''
          },
          privateInstructions: offer.privateInstructions || 'Share payment details in chat.',
          status: 'ESCROW_LOCKED',
          buyerPaidAt: null,
          disputeInfo: null,
          createdAt: now,
          expiresAt: now + 15 * 60 * 1000
        };

        const ref = await addDoc(pubCol('trades'), tradeDoc);

        // Post opening System Message in trade_messages
        await addDoc(pubCol('trade_messages'), {
          tradeId: ref.id,
          senderUid: 'SYSTEM',
          senderName: 'Wayones Escrow',
          senderRole: 'SYSTEM',
          text: `Escrow locked ${formatCrypto(cryptoAmount, offer.crypto)} ${offer.crypto} for ${formatFiat(fiatAmount, offer.fiat)} via ${selectedPayment}. Offer terms snapshot permanently frozen.`,
          createdAt: now
        });

        closeModal();
        showToast('Escrow Trade opened! Opening live Trade Room...', 'success');
        setTimeout(() => openTradeRoom(ref.id), 150);
      } catch (err) {
        console.error('Create trade error:', err);
        showToast('Failed to open trade: ' + (err.message || 'Unknown error'), 'error');
        if (btn) { btn.disabled = false; btn.textContent = 'Retry Open Trade'; }
      }
    }

    function openTradeRoom(tradeId) {
      state.activeTradeRoomId = tradeId;
      clearTradeTimer();
      refreshTradeRoomModal();
      startTradeTimer(tradeId);
    }

    function clearTradeTimer() {
      if (tradeTimerHandle) { clearInterval(tradeTimerHandle); tradeTimerHandle = null; }
    }

    function startTradeTimer(tradeId) {
      clearTradeTimer();
      tradeTimerHandle = setInterval(() => {
        const t = state.trades.find(x => x.id === tradeId);
        const el = document.getElementById('room-timer');
        if (!t || !el || ['RELEASED', 'REFUNDED', 'CANCELLED'].includes(t.status)) {
          clearTradeTimer();
          return;
        }
        const diff = Math.max(0, (t.expiresAt || 0) - Date.now());
        el.textContent = `${String(Math.floor(diff / 60000)).padStart(2, '0')}:${String(Math.floor((diff % 60000) / 1000)).padStart(2, '0')}`;
      }, 1000);
    }

    function refreshTradeRoomModal() {
      if (!state.activeTradeRoomId) return;
      const trade = state.trades.find(t => t.id === state.activeTradeRoomId);
      if (!trade) return;

      const prevInp = document.getElementById('room-chat-inp');
      const savedDraft = prevInp ? prevInp.value : '';

      const uid = state.authUser ? state.authUser.uid : '';
      const amBuyer = trade.buyerUid === uid;
      const amSeller = trade.sellerUid === uid;
      const st = trade.status;
      const isClosed = ['RELEASED', 'REFUNDED', 'CANCELLED'].includes(st);
      const step = st === 'RELEASED' ? 3 : (st === 'PAID' || st === 'DISPUTED' ? 2 : 1);

      const diffMs = Math.max(0, (trade.expiresAt || 0) - Date.now());
      const mm = String(Math.floor(diffMs / 60000)).padStart(2, '0');
      const ss = String(Math.floor((diffMs % 60000) / 1000)).padStart(2, '0');

      const tradeMsgs = state.messages.filter(m => m.tradeId === trade.id);

      const stepDot = (n, label) => {
        const done = (st === 'RELEASED' && n <= 3) || (!isClosed && step > n);
        const curr = !isClosed && step === n;
        const disp = st === 'DISPUTED' && n >= 2;
        return `
          <div class="flex flex-col items-center gap-1 z-10 flex-1">
            <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-extrabold border-2 ${
              disp ? 'bg-sell/20 border-sell text-red-300' :
              done ? 'bg-buy border-buy text-[#041F15]' :
              curr ? 'bg-brand border-brand text-white shadow-glow' :
              'bg-surface-elevated border-surface-border text-slate-500'
            }">${done ? '✓' : n}</div>
            <span class="text-[11px] font-bold text-center ${curr ? 'text-white' : done ? 'text-buy' : 'text-slate-400'}">${label}</span>

      let actionHTML = '';
      if (st === 'RELEASED') {

    async function settleEscrowRelease(tradeId, byAdmin = false, adminNote = '') {
      if (!db) return;
      const trade = state.trades.find(t => t.id === tradeId);
      if (!trade || ['RELEASED', 'REFUNDED', 'CANCELLED'].includes(trade.status)) return;

      const coin = trade.crypto;
      const qty = Number(trade.cryptoAmount);

      try {
        // 1. Credit Buyer's available balance & increment trade counters
        const buyerDoc = state.usersMap[trade.buyerUid];
        if (buyerDoc) {
          const bBal = getUserBalances(buyerDoc);
          await updateDoc(pubDoc('users', trade.buyerUid), {
            balances: { ...bBal.available, [coin]: Number(((bBal.available[coin] || 0) + qty).toFixed(8)) },
            completedTrades: (buyerDoc.completedTrades || 0) + 1,
            totalTrades: (buyerDoc.totalTrades || 0) + 1
          });
        }

        // 2. Release Seller's locked balance & increment counters
        const sellerDoc = state.usersMap[trade.sellerUid];
        if (sellerDoc) {
          const sBal = getUserBalances(sellerDoc);
          await updateDoc(pubDoc('users', trade.sellerUid), {
            lockedBalances: { ...sBal.locked, [coin]: Math.max(0, Number(((sBal.locked[coin] || 0) - qty).toFixed(8))) },
            completedTrades: (sellerDoc.completedTrades || 0) + 1,
            totalTrades: (sellerDoc.totalTrades || 0) + 1
          });
        }

        // 3. Update Trade Document
        const updatePayload = { status: 'RELEASED' };
        if (byAdmin && trade.disputeInfo) {
          updatePayload.disputeInfo = {
            ...trade.disputeInfo,
            adminVerdict: adminNote || 'Arbitrator verified buyer payment and awarded Escrow funds to Buyer.',
            resolvedAt: Date.now()
          };
        }
        await updateDoc(pubDoc('trades', tradeId), updatePayload);

        await addDoc(pubCol('trade_messages'), {
          tradeId,
          senderUid: byAdmin ? 'ADMIN' : 'SYSTEM',
          senderName: byAdmin ? 'Wayones Arbitrator' : 'Wayones Escrow',
          senderRole: byAdmin ? 'ADMIN' : 'SYSTEM',
          text: byAdmin
            ? `FINAL VERDICT: Awarded ${formatCrypto(qty, coin)} ${coin} to Buyer. ${adminNote}`            : `Seller verified payment & released ${formatCrypto(qty, coin)} ${coin} from Escrow to Buyer!`,
          createdAt: Date.now()
        });

        showToast(`Released ${formatCrypto(qty, coin)} ${coin} to Buyer!`, 'success');
      } catch (err) {
        console.error('Release failed:', err);
        showToast('Failed to release escrow.', 'error');
      }
    }

    async function submitDispute(e, tradeId) {

          status: 'DISPUTED',
          disputeInfo: {
            openedByUid: state.authUser.uid,
            openedByRole: role,
            reason,
            utrNumber,
            proofUrl,
            openedAt: Date.now(),
            adminVerdict: null,
            resolvedAt: null

        await addDoc(pubCol('trade_messages'), {
          tradeId,
          senderUid: 'SYSTEM',
          senderName: 'Wayones Escrow',

    async function generateRealEvmWallet() {
      try {
        let address = '';
        let mnemonic = '';
        let privateKey = '';

        if (window.ethers && window.ethers.Wallet && typeof window.ethers.Wallet.createRandom === 'function') {
          const w = window.ethers.Wallet.createRandom();
          address = w.address;
          mnemonic = w.mnemonic ? w.mnemonic.phrase : '';
          privateKey = w.privateKey;
        } else {
          // Cryptographic fallback using Web Crypto getRandomValues if offline CDN unavailable
          const bytes = new Uint8Array(20);
          window.crypto.getRandomValues(bytes);
          address = '0x' + Array.from(bytes).map(b => b.toString(16).padStart(2, '0')).join('');
          const words = [];
          const pool = [...FALLBACK_WORDS];
          for (let i = 0; i < 12; i++) {
            const r = new Uint32Array(1);
            window.crypto.getRandomValues(r);
            words.push(pool.splice(r[0] % pool.length, 1)[0]);
          }
          mnemonic = words.join(' ');
        }

        state.deviceWallet.address = address;
        state.deviceWallet.mnemonic = mnemonic;
        state.deviceWallet.privateKey = privateKey;
        state.deviceWallet.seedRevealed = false;
        state.deviceWallet.seedBackedUp = false;

        // Sync ONLY the PUBLIC 0x... address to Firestore (NEVER private key or seed phrase!)
        if (db && state.isMember && state.authUser) {
          await updateDoc(pubDoc('users', state.authUser.uid), {
            publicWalletAddress: address
          }).catch(() => {});
        }

        renderAll();
        showToast('Real EVM Non-Custodial Wallet generated on your device!', 'success');
      } catch (err) {
        console.error('Wallet generation error:', err);
        showToast('Wallet generation failed.', 'error');
      }
    }

    async function submitImportSeed(e) {
      e.preventDefault();
      const phrase = (document.getElementById('import-seed-inp')?.value || '').trim().toLowerCase().replace(/\s+/g, ' ');
      const errBox = document.getElementById('import-seed-err');
      try {
        let address = '';
        let privateKey = '';
        if (window.ethers && window.ethers.Wallet && typeof window.ethers.Wallet.fromPhrase === 'function') {
          const w = window.ethers.Wallet.fromPhrase(phrase);
          address = w.address;
          privateKey = w.privateKey;
        } else {
          if (phrase.split(' ').length !== 12) throw new Error('Must be exactly 12 words.');
          const hash = await sha256Hex(phrase);
          address = '0x' + hash.slice(0, 40);
        }

        state.deviceWallet.address = address;
        state.deviceWallet.mnemonic = phrase;
        state.deviceWallet.privateKey = privateKey;
        state.deviceWallet.seedBackedUp = true;

        if (db && state.isMember && state.authUser) {
          await updateDoc(pubDoc('users', state.authUser.uid), { publicWalletAddress: address }).catch(() => {});
        }
        closeModal();
        renderAll();
        showToast(`Wallet restored: ${shortAddr(address)}`, 'success');
      } catch (err) {
        if (errBox) {
          errBox.textContent = 'Invalid BIP-39 12-word recovery phrase. Check spelling and word order.';
          errBox.classList.remove('hidden');
        }
      }
    }

    async function submitClaimOwner(e) {
      e.preventDefault();
      const p1 = (document.getElementById('claim-pin-1')?.value || '').trim();
      const p2 = (document.getElementById('claim-pin-2')?.value || '').trim();
      const errBox = document.getElementById('claim-err');

      if (!/^\d{6}$/.test(p1)) {
        if (errBox) { errBox.textContent = 'PIN must be exactly 6 numeric digits.'; errBox.classList.remove('hidden'); }
        return;
      }
      if (p1 !== p2) {
        if (errBox) { errBox.textContent = 'PINs do not match.'; errBox.classList.remove('hidden'); }
        return;
      }

      try {
        // Double-check Firestore before claiming so race condition cannot overwrite an existing owner
        const cfgRef = pubDoc('system', 'adminConfig');
        const snap = await getDoc(cfgRef);
        if (snap.exists()) {
          closeModal();
          return;
        }

        const pinHash = await sha256Hex(`${state.authUser.uid}:${p1}:wayones_owner_salt`);
        await setDoc(cfgRef, {
          ownerUid: state.authUser.uid,
          ownerEmail: state.authUser.email || '',
          pinHash,
          claimedAt: Date.now()
        });

        state.ownerSessionUnlocked = true;
        closeModal();
        openOwnerOverlay();
        showToast('Owner UID permanently bound! Welcome to Wayones Owner Console.', 'success');
      } catch (err) {
        console.error('Claim owner failed:', err);
        if (errBox) { errBox.textContent = 'Failed to bind Owner config.'; errBox.classList.remove('hidden'); }
      }
    }

      const firestoreRulesText = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function isSignedIn() {
      return request.auth != null;
    }
    function isOwner() {
      return isSignedIn() && request.auth.uid == "${ownerUid}";
    }

    match /artifacts/{appId}/public/data/system/adminConfig {
      allow read: if isSignedIn();
      // One-time claim only if doc doesn't exist; updates strictly Owner-only
      allow create: if isSignedIn() && !exists(/databases/$(database)/documents/artifacts/$(appId)/public/data/system/adminConfig);
      allow update, delete: if isOwner();
    }

    match /artifacts/{appId}/public/data/users/{uid} {
      allow read: if isSignedIn();
      allow create: if isSignedIn() && request.auth.uid == uid;
      // Only user (cannot unban themselves) OR Owner can update
      allow update: if isOwner() || (isSignedIn() && request.auth.uid == uid && request.resource.data.banned == resource.data.banned);
      allow delete: if isOwner();
    }

    match /artifacts/{appId}/public/data/offers/{offerId} {
      allow read: if isSignedIn();
      allow create: if isSignedIn();
      allow update, delete: if isOwner() || (isSignedIn() && resource.data.creatorUid == request.auth.uid);
    }

    match /artifacts/{appId}/public/data/trades/{tradeId} {
      allow read: if isOwner() || (isSignedIn() && (resource.data.buyerUid == request.auth.uid || resource.data.sellerUid == request.auth.uid));
      allow create: if isSignedIn();
      // Only Owner can execute REFUNDED verdict or resolve DISPUTED trades
      allow update: if isOwner() || (
        isSignedIn() &&
        (resource.data.buyerUid == request.auth.uid || resource.data.sellerUid == request.auth.uid) &&
        resource.data.status != 'DISPUTED' &&
        request.resource.data.status != 'REFUNDED'
      );
    }

    match /artifacts/{appId}/public/data/trade_messages/{msgId} {
      allow read, create: if isSignedIn();
      allow update, delete: if false; // Immutable chat audit log
    }
  }
}`;

                      <input id="admin-verdict-inp" type="text" value="Evidence and frozen offer terms audited by Wayones Owner Arbitration." class="w-full h-10 px-3 rounded-xl bg-surface-elevated border border-surface-border text-xs text-white" />
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button onclick="window.app.adminExecuteVerdict('${activeCase.id}', 'BUYER')" class="min-h-[44px] px-4 py-2.5 rounded-xl bg-buy hover:bg-emerald-400 text-[#041F15] font-extrabold text-xs sm:text-sm">
                          ⚖️ Award Funds to Buyer (RELEASED)
                        </button>
                        <button onclick="window.app.adminExecuteVerdict('${activeCase.id}', 'SELLER')" class="min-h-[44px] px-4 py-2.5 rounded-xl bg-brand hover:bg-brand-hover text-white font-extrabold text-xs sm:text-sm shadow-glow">
                          ⚖️ Refund Funds to Seller (REFUNDED)
                        </button>
                      </div>
                    </div>
                  ` : ''}
                </div>
              ` : ''}
            </div>
          `;
        }
      } else if (state.ownerPanelTab === 'moderation') {
        tabBody = `
          <div class="space-y-6">
            <!-- Live Offers Moderation -->
            <section class="bg-surface-card border border-surface-border rounded-3xl p-5 space-y-3">
              <h3 class="font-display text-base font-extrabold text-white">Live Marketplace Offers (${allLiveOffers.length})</h3>
              ${allLiveOffers.length === 0 ? `<p class="text-xs text-slate-400">No user-created live offers in Firestore yet.</p>` : `
                <div class="space-y-2.5">
                  ${allLiveOffers.map(o => `
                    <div class="bg-surface-elevated/70 border border-surface-border rounded-2xl p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div>
                        <div class="text-xs sm:text-sm font-bold text-white">${esc(o.creatorName)} — ${o.type} ${o.crypto} @ ${formatFiat(o.price, o.fiat)}</div>
                        <div class="text-[11px] text-slate-400">Status: <strong class="${o.status === 'ACTIVE' ? 'text-buy' : 'text-amber-300'}">${o.status}</strong> • Third-Party: ${o.termsFlags?.thirdPartyAllowed ? 'Allowed' : 'Own Only'}</div>
                      </div>
                      <div class="flex gap-2 shrink-0">
                        <button onclick="window.app.adminToggleOfferStatus('${o.id}', '${o.status === 'ACTIVE' ? 'PAUSED' : 'ACTIVE'}')" class="px-3 py-1.5 rounded-lg bg-surface-bg border border-surface-border text-xs font-bold text-slate-200 hover:text-white">
                          ${o.status === 'ACTIVE' ? 'Pause' : 'Activate'}
                        </button>
                        <button onclick="window.app.adminToggleOfferStatus('${o.id}', 'REMOVED')" class="px-3 py-1.5 rounded-lg bg-sell/15 border border-sell/35 text-xs font-bold text-red-300 hover:bg-sell hover:text-white">
                          Remove
                        </button>
                      </div>
                    </div>
                  `).join('')}
                </div>
              `}
            </section>

            <!-- Registered Users Moderation -->
            <section class="bg-surface-card border border-surface-border rounded-3xl p-5 space-y-3">
              <h3 class="font-display text-base font-extrabold text-white">Registered Users (${usersList.length})</h3>
              <div class="space-y-2.5">
                ${usersList.map(u => {
                  const isSelf = u.id === ownerUid;
                  return `
                    <div class="bg-surface-elevated/70 border border-surface-border rounded-2xl p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                      <div class="min-w-0">
                        <div class="flex items-center gap-2 flex-wrap">
                          <span class="text-sm font-bold text-white">${esc(u.displayName || 'Trader')}</span>
                          ${isSelf ? `<span class="px-2 py-0.5 rounded bg-brand/20 text-brand text-[10px] font-extrabold">OWNER</span>` : ''}
                          ${u.banned ? `<span class="px-2 py-0.5 rounded bg-sell text-white text-[10px] font-extrabold">BANNED</span>` : ''}
                        </div>
                        <div class="text-xs text-slate-400 truncate">${esc(u.email)} • Wallet: <span class="font-mono">${esc(shortAddr(u.publicWalletAddress))}</span> • Completed: ${u.completedTrades || 0}</div>
                      </div>
                      ${!isSelf ? `
                        <button onclick="window.app.adminToggleBanUser('${u.id}', ${!u.banned})" class="px-3.5 py-2 rounded-xl text-xs font-extrabold shrink-0 ${
                          u.banned ? 'bg-buy/15 border border-buy/35 text-buy' : 'bg-sell/15 border border-sell/35 text-red-300 hover:bg-sell hover:text-white'
                        }">
                          ${u.banned ? 'Unban User' : 'Ban User'}
                        </button>
                      ` : ''}
                    </div>
                  `;
                }).join('')}
              </div>
            </section>
          </div>
        `;
      } else {
        tabBody = `
          <div class="space-y-5">
            <!-- Firestore Security Rules Box -->
            <section class="bg-surface-card border border-brand/35 rounded-3xl p-5 space-y-3">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                  <h3 class="font-display text-base font-extrabold text-white">Server-Enforced Cloud Firestore Security Rules</h3>
                  <p class="text-xs text-slate-400">Paste these rules into Firebase Console → Firestore Database → Rules to enforce Owner UID access on Google's servers.</p>
                </div>
                <button onclick="window.app.copyFirestoreRules()" class="px-4 py-2 rounded-xl bg-brand hover:bg-brand-hover text-white text-xs font-extrabold shrink-0">Copy Security Rules</button>
              </div>
              <pre id="owner-rules-pre" class="bg-surface-bg border border-surface-border rounded-2xl p-4 text-[11px] font-mono text-emerald-300 overflow-x-auto leading-relaxed">${esc(firestoreRulesText)}</pre>
            </section>

            <!-- Mainnet Deployment Checklist -->
            <section class="bg-surface-card border border-surface-border rounded-3xl p-5 space-y-3">
              <h3 class="font-display text-base font-extrabold text-white">Mainnet BSC / Polygon Escrow Deployment Checklist</h3>
              <ul class="space-y-2 text-xs text-slate-300 list-disc pl-5 leading-relaxed">
                <li><strong>Smart Contract Escrow:</strong> Deploy an audited 2-of-3 Multi-Sig Escrow contract (Solidity) on BNB Smart Chain or Polygon PoS where Seller calls <code class="text-brand">lockUSDT()</code>, releases via <code class="text-brand">releaseToBuyer()</code>, and your Owner address acts as the 3rd Arbitrator key exclusively on <code class="text-sell">DISPUTED</code> trades.</li>
                <li><strong>Firebase Production Setup:</strong> Enable <em>Email/Password</em> under Firebase Authentication, paste the Security Rules above, and restrict your Firebase API key to your custom domain in Google Cloud Console.</li>
                <li><strong>Custom Domain & HTTPS:</strong> Host <code class="text-white">wayones.html</code> (renamed to <code class="text-white">index.html</code>) on Cloudflare Pages, Vercel, or Firebase Hosting and bind your custom domain with automatic TLS/SSL.</li>
                <li><strong>Security Audit:</strong> Before allowing real public USDT funds, run a professional smart-contract audit and verify local regulatory requirements for your target regions.</li>
              </ul>
            </section>
          </div>
        `;
      }

      root.innerHTML = `
        <div class="fixed inset-0 z-[100] bg-surface-bg overflow-y-auto animate-fade">
          <div class="sticky top-0 z-20 bg-surface-card/95 backdrop-blur-xl border-b border-brand/35 px-4 sm:px-6 h-16 flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
              <span class="px-2.5 py-1 rounded-lg bg-brand text-white text-[11px] font-extrabold uppercase tracking-wider">Owner Console</span>
              <h2 class="font-display text-sm sm:text-base font-extrabold text-white truncate">Wayones Administration</h2>
            </div>
            <button onclick="window.app.closeOwnerOverlay()" class="px-4 py-2 rounded-xl bg-surface-elevated hover:bg-white/10 border border-surface-border text-xs font-bold text-white">
              Return to App
            </button>
          </div>

          <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6 space-y-6">
            <!-- Live KPI Stats -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
              <div class="bg-surface-card border border-surface-border rounded-2xl p-4">
                <div class="text-xs text-slate-400">Total Users</div>
                <div class="font-display text-2xl font-extrabold text-white tabular-nums mt-1">${usersList.length}</div>
              </div>
              <div class="bg-surface-card border border-surface-border rounded-2xl p-4">
                <div class="text-xs text-slate-400">Active Offers</div>
                <div class="font-display text-2xl font-extrabold text-brand tabular-nums mt-1">${activeOffers.length}</div>
              </div>
              <div class="bg-surface-card border border-sell/40 rounded-2xl p-4">
                <div class="text-xs text-red-300">Open Disputes</div>
                <div class="font-display text-2xl font-extrabold text-sell tabular-nums mt-1">${openDisputes.length}</div>
              </div>
              <div class="bg-surface-card border border-buy/35 rounded-2xl p-4">
                <div class="text-xs text-emerald-300">Completed Trades</div>
                <div class="font-display text-2xl font-extrabold text-buy tabular-nums mt-1">${completedTrades.length}</div>
              </div>
            </div>

            <!-- Admin Navigation Tabs -->
            <div class="flex items-center gap-2 overflow-x-auto no-scrollbar">
              <button onclick="window.app.setOwnerTab('disputes')" class="px-4 py-2.5 rounded-xl text-xs font-extrabold whitespace-nowrap border ${state.ownerPanelTab === 'disputes' ? 'bg-brand text-white border-brand shadow-glow' : 'bg-surface-card border-surface-border text-slate-300'}">
                Dispute Arbitration Desk (${openDisputes.length})
              </button>
              <button onclick="window.app.setOwnerTab('moderation')" class="px-4 py-2.5 rounded-xl text-xs font-extrabold whitespace-nowrap border ${state.ownerPanelTab === 'moderation' ? 'bg-brand text-white border-brand shadow-glow' : 'bg-surface-card border-surface-border text-slate-300'}">
                Marketplace & User Moderation
              </button>
              <button onclick="window.app.setOwnerTab('security')" class="px-4 py-2.5 rounded-xl text-xs font-extrabold whitespace-nowrap border ${state.ownerPanelTab === 'security' ? 'bg-brand text-white border-brand shadow-glow' : 'bg-surface-card border-surface-border text-slate-300'}">
                Live Deployment Security
              </button>
            </div>

            ${tabBody}
          </div>
        </div>
      `;
    }

    async function sendAdminChatMessage(e, tradeId) {
      e.preventDefault();
      if (!db || !state.ownerSessionUnlocked) return;
      const inp = document.getElementById('admin-chat-inp');
      const text = (inp?.value || '').trim();
      if (!text) return;
      inp.value = '';
      try {
        await addDoc(pubCol('trade_messages'), {
          tradeId,
          senderUid: state.authUser.uid,
          senderName: 'Wayones Arbitrator',
          senderRole: 'ADMIN',
          text,
          createdAt: Date.now()
        });
        showToast('Arbitrator message posted to trade chat.', 'success');
      } catch (err) {
        console.error('Admin chat error:', err);
      }
    }

    async function adminExecuteVerdict(tradeId, winner) {
      if (!state.ownerSessionUnlocked) return;
      const note = (document.getElementById('admin-verdict-inp')?.value || '').trim();
      if (winner === 'BUYER') {
        await settleEscrowRelease(tradeId, true, note);
      } else {
        await settleEscrowRefund(tradeId, note);
      }
      renderOwnerOverlay();
    }

    async function adminToggleOfferStatus(offerId, newStatus) {
      if (!db || !state.ownerSessionUnlocked) return;
      try {
        await updateDoc(pubDoc('offers', offerId), { status: newStatus });
        showToast(`Offer status updated to ${newStatus}.`, 'success');
      } catch (err) {
        showToast('Failed to update offer.', 'error');
      }
    }

    async function adminToggleBanUser(uid, shouldBan) {
      if (!db || !state.ownerSessionUnlocked) return;
      try {
        await updateDoc(pubDoc('users', uid), { banned: Boolean(shouldBan) });
        showToast(shouldBan ? 'User has been banned.' : 'User unbanned.', 'warning');
      } catch (err) {
        showToast('Failed to update user moderation status.', 'error');
      }
    }

    /* =========================================================================
       14. MODAL HELPERS & PUBLIC EVENT BRIDGE
       ========================================================================= */
    function openModal(html) {
      const root = document.getElementById('modal-root');
      if (root) root.innerHTML = html;
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const root = document.getElementById('modal-root');
      if (root) root.innerHTML = '';
      state.activeTradeRoomId = null;
      tradeDraft = null;
      clearTradeTimer();
      if (!state.ownerPanelOpen) {
        document.body.style.overflow = '';
      }
    }

    // Bind brand logo click listener for normal home navigation + hidden 5-tap gesture
    document.getElementById('brand-logo-btn')?.addEventListener('click', handleBrandLogoClick);

    // Expose clean API for inline HTML handlers
    window.app = {
      switchView(v) { state.activeView = v; renderAll(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
      setFiat(code) { if (FIATS[code]) { state.fiat = code; state.postDraft.fiat = code; renderAll(); showToast(`Currency switched to ${code}`, 'info'); } },
      handleHeaderAuthClick() { state.isMember ? this.switchView('profile') : openAuthModal('signin'); },
      openAuthModal,
      submitAuthForm,
      handleSignOut,
      setMarketFilter(k, v) { state.marketFilter[k] = v; renderAll(); },
      setMarketAmount(v) {
        state.marketFilter.amount = v;
        const el = document.getElementById('market-amt-input');
        const pos = el ? el.selectionStart : null;
        renderAll();
        const next = document.getElementById('market-amt-input');
        if (next) { next.focus(); if (pos !== null) { try { next.setSelectionRange(pos, pos); } catch (e) {} } }
      },
      resetFilters() {
        state.marketFilter.payment = 'ALL';
        state.marketFilter.thirdParty = 'ALL';
        state.marketFilter.amount = '';
        state.marketFilter.sort = 'best_price';
        renderAll();
      },
      removeMyOffer,
      openTradeModal,
      fillTradeFiat(val) {
        const inp = document.getElementById('td-fiat-inp');
        if (inp) { inp.value = Number(val).toFixed(2); this.syncTradeFromFiat(); }
      },
      syncTradeFromFiat() {
        if (!tradeDraft) return;
        const f = parseFloat(document.getElementById('td-fiat-inp')?.value);
        const cInp = document.getElementById('td-crypto-inp');
        if (cInp) cInp.value = (!isNaN(f) && f >= 0) ? formatCrypto(f / Number(tradeDraft.offer.price), tradeDraft.offer.crypto) : '';
        validateTradeDraft();
      },
      syncTradeFromCrypto() {
        if (!tradeDraft) return;
        const c = parseFloat(document.getElementById('td-crypto-inp')?.value);
        const fInp = document.getElementById('td-fiat-inp');
        if (fInp) fInp.value = (!isNaN(c) && c >= 0) ? (c * Number(tradeDraft.offer.price)).toFixed(2) : '';
        validateTradeDraft();
      },
      selectTradePM(pm) {
        if (!tradeDraft) return;
        tradeDraft.selectedPayment = pm;
        document.querySelectorAll('.td-pm-btn').forEach(b => {
          const on = b.dataset.pm === pm;
          b.className = `td-pm-btn px-3 py-2 rounded-xl text-xs font-bold border transition-all ${on ? 'bg-brand/20 border-brand text-white' : 'bg-surface-elevated border-surface-border text-slate-400'}`;
        });
      },
      toggleTradeAgree(checked) { if (tradeDraft) { tradeDraft.agreed = Boolean(checked); validateTradeDraft(); } },
      confirmOpenTrade,
      setTradesTab(t) { state.tradesTab = t; renderAll(); },
      openTradeRoom,
      sendTradeMessage,
      openMarkPaidModal,
      submitMarkPaid,
      cancelEscrowTrade,
      sellerReleaseCrypto(id) { settleEscrowRelease(id, false); },
      simulateFeaturedRelease(id) { settleEscrowRelease(id, false); },
      simulateFeaturedBuyerPaid,
      openDisputeModal,
      submitDispute,
      setPostDraft(k, v) { state.postDraft[k] = v; renderAll(); },
      togglePostDraft(k) { state.postDraft[k] = !state.postDraft[k]; renderAll(); },
      togglePostPM(pm) {
        const arr = state.postDraft.paymentMethods;
        state.postDraft.paymentMethods = arr.includes(pm) ? arr.filter(x => x !== pm) : [...arr, pm];
        renderAll();
      },
      submitNewOffer,
      generateRealEvmWallet,
      openImportSeedModal,
      submitImportSeed,
      setWalletNetwork(net) { state.deviceWallet.network = net; renderAll(); },
      toggleSeedReveal() { state.deviceWallet.seedRevealed = !state.deviceWallet.seedRevealed; renderAll(); },
      confirmSeedBackedUp() { state.deviceWallet.seedBackedUp = true; renderAll(); showToast('Seed phrase backup confirmed!', 'success'); },
      claimTestnetFaucet,
      updateDisplayName,
      submitClaimOwner,
      verifyOwnerPin,
      closeOwnerOverlay,
      setOwnerTab(t) { state.ownerPanelTab = t; renderOwnerOverlay(); },
      selectAdminDispute(id) { state.selectedAdminDisputeId = id; renderOwnerOverlay(); },
      sendAdminChatMessage,
      adminExecuteVerdict,
      adminToggleOfferStatus,
      adminToggleBanUser,
      copyFirestoreRules() {
        const txt = document.getElementById('owner-rules-pre')?.textContent || '';
        copyText(txt, 'Firestore Security Rules copied!');
      },
      copy: copyText,
      closeModal,
      handleBackdrop(e) { if (e.target === e.currentTarget) closeModal(); }
    };

    // Start Application
    bootFirebase();
  </script>
</body>
</html>
